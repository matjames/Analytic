# ═══════════════════════════════════════════════════════════════════
# STATGATE UNIFIED PRODUCTION REVERSE PROXY & GATEWAY
# ═══════════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream Services
    upstream app_launcher    { server statgate-launcher:3002; }
    upstream pms_frontend    { server pms-frontend:3010; }
    upstream pms_backend     { server pms-backend:8091; }
    upstream rms_frontend    { server rms-frontend:3011; }
    upstream rms_backend     { server rms-backend:8092; }
    upstream gov_frontend    { server statgovernance-frontend:3012; }
    upstream gov_backend     { server statgovernance-backend:8093; }
    upstream spatial_frontend { server statspatial-frontend:3014; }
    upstream spatial_backend { server statspatial-backend:8094; }
    upstream registry_frontend { server registry-frontend:3007; }
    upstream registry_backend { server registry-backend:9090; }
    upstream statchat_frontend { server statchat-frontend:3009; }
    upstream statchat_backend { server statchat-backend:4000; }
    upstream analytics_ui    { server statgate-analytics:5000; }
    upstream enterprise_core { server enterprise-core:8096; }
    upstream statcollect_api { server statcollect-api:8080; }
    upstream helpdesk_ui     { server helpdesk:5006; }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # App Launcher (Default / Root)
        location / {
            proxy_pass http://app_launcher;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # PMS
        location /pms/ {
            proxy_pass http://pms_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/pms/ {
            proxy_pass http://pms_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # RMS
        location /rms/ {
            proxy_pass http://rms_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/rms/ {
            proxy_pass http://rms_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # StatGovernance
        location /governance/ {
            proxy_pass http://gov_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/governance/ {
            proxy_pass http://gov_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # StatSpatial
        location /spatial/ {
            proxy_pass http://spatial_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/spatial/ {
            proxy_pass http://spatial_backend/api/spatial/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Field Registry
        location /registry/ {
            proxy_pass http://registry_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/registry/ {
            proxy_pass http://registry_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # StatChat
        location /statchat/ {
            proxy_pass http://statchat_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/statchat/ {
            proxy_pass http://statchat_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Enterprise Core APIs
        location /api/enterprise/ {
            proxy_pass http://enterprise_core/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # StatCollect Submissions (ODK)
        location /submission {
            proxy_pass http://statcollect_api/submission;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /formList {
            proxy_pass http://statcollect_api/formList;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Analytics Hub
        location /analytics/ {
            proxy_pass http://analytics_ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # HelpDesk
        location /helpdesk/ {
            proxy_pass http://helpdesk_ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
