# Default upstream for the main launcher application
upstream launcher {
  server launcher:3000;
}

# Upstream for stats suite application
upstream stats-suite {
  server stats-suite:80;
}

# Upstream for warehouse application
upstream warehouse {
  server warehouse:80;
}

# Upstream for reports application
upstream reports {
  server reports:80;
}

# Upstream for admin application
upstream admin {
  server admin:80;
}

# Upstream for integration application
upstream integration {
  server integration:80;
}

# HTTP to HTTPS redirect
server {
  listen 80;
  server_name _;

  # Health check endpoint
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }

  # Redirect all other traffic to HTTPS (when SSL is configured)
  # Uncomment the line below when SSL certificates are available
  # return 301 https://$host$request_uri;

  # For now, proxy to launcher
  location / {
    proxy_pass http://launcher;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}

