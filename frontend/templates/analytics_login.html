<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StatGate Analytics Sign In</title>
  <style>
    :root {
      --primary-color: #165c92;
      --primary-light: #1a7ab5;
      --primary-dark: #0f3f5f;
      --bg-light: #f7f9fb;
      --card-bg: rgba(255,255,255,0.96);
      --border-color: #dfe7ef;
      --text-main: #1a1a1a;
      --text-muted: #5f6f80;
      --danger: #c92d2d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", sans-serif;
      color: var(--text-main);
      background: linear-gradient(180deg, #f5f8fb 0%, #eef4fb 100%);
      min-height: 100vh;
    }
    .topbar {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
      box-shadow: 0 2px 10px rgba(22, 92, 146, 0.18);
      padding: 0.75rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      color: #fff;
      text-decoration: none;
    }
    .brand img {
      width: 34px;
      height: 34px;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }
    .brand-copy {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }
    .brand-copy strong {
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .brand-copy span {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.9);
    }
    .header-link {
      color: rgba(255,255,255,0.92);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .shell {
      min-height: calc(100vh - 72px);
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }
    .card {
      width: min(440px, calc(100% - 2rem));
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 16px 35px rgba(15, 63, 95, 0.12);
      padding: 2rem 1.75rem 1.5rem;
    }
    .eyebrow {
      color: var(--primary-color);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.7rem;
      margin-bottom: 0.6rem;
      display: block;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 2vw, 2.1rem);
      line-height: 1.1;
    }
    p {
      margin: 0.7rem 0 1.2rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    form {
      display: grid;
      gap: 0.8rem;
    }
    input {
      width: 100%;
      padding: 0.9rem 0.95rem;
      font-size: 0.96rem;
      border-radius: 8px;
      border: 1px solid #cfe0ee;
      background: #fff;
      color: var(--text-main);
    }
    input:focus {
      outline: 2px solid rgba(22, 92, 146, 0.15);
      border-color: var(--primary-color);
    }
    button {
      width: 100%;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
      color: #fff;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(22, 92, 146, 0.2);
    }
    button:hover { opacity: 0.97; }
    .error {
      color: var(--danger);
      min-height: 1.25rem;
      font-size: 0.85rem;
      margin-top: -0.15rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand" aria-label="StatGate home">
        <img src="{{ analytics_logo_url }}" alt="StatGate logo">
        <div class="brand-copy">
          <strong>StatGate</strong>
          <span>Analytics &amp; Decision Support</span>
        </div>
      </a>
      <a href="{{ registry_ui_url }}" class="header-link" target="_blank" rel="noopener">Open Registry</a>
    </div>
  </header>
  <main class="shell">
    <section class="card">
      <span class="eyebrow">Platform Access</span>
      <h1>StatGate Analytics</h1>
      <p>Sign in with your Field Operations Registry account to continue into the live analytics workspace.</p>
      <form id="login">
        <input name="emailOrUsername" placeholder="Email or username" required autofocus>
        <input name="password" type="password" placeholder="Password" required>
        <div id="error" class="error"></div>
        <button type="submit">Sign in</button>
      </form>
    </section>
  </main>
  <script>
    document.querySelector('#login').addEventListener('submit', async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const r = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.fromEntries(f))
      });
      const d = await r.json();
      if (!r.ok) {
        document.querySelector('#error').textContent = d.error || 'Sign-in failed';
        return;
      }
      location.href = new URLSearchParams(window.location.search).get('next') || '/';
    });
  </script>
</body>
</html>
