global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'rules/alert.rules.yml'
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'statgate-analytics'
    metrics_path: /metrics
    static_configs:
      - targets: ['statgate-analytics:5000']

  - job_name: 'statgate-core'
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ['statgate-core:8080']

  - job_name: 'statgate-registry'
    metrics_path: /metrics
    static_configs:
      - targets: ['statgate-registry-api:9090']

  - job_name: 'statgate-pms'
    metrics_path: /metrics
    static_configs:
      - targets: ['statgate-pms-api:8080']

  - job_name: 'statchat'
    metrics_path: /metrics
    static_configs:
      - targets: ['statchat-backend:4000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
