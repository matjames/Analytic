server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - action: replace
        source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: job
      - action: replace
        source_labels: [__meta_docker_container_name]
        target_label: container
      - action: replace
        source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
      - action: replace
        source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      - action: replace
        source_labels: [__meta_docker_container_label_com_docker_compose_version]
        target_label: compose_version
      - action: replace
        source_labels: [__meta_docker_container_label_name]
        target_label: name
      - action: replace
        source_labels: [__meta_docker_container_label_image]
        target_label: image
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: "(.+)"
        target_label: __path__
        replacement: /var/lib/docker/containers/*/*-json.log
