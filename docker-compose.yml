    restart: unless-stopped
    networks:
      - statgate-network

  jupyterhub:
    profiles:
      - "analytics-labs"
    build:
      context: ./jupyterhub
    environment:
      - STATGATE_JUPYTERHUB_ENABLED=${STATGATE_JUPYTERHUB_ENABLED:-true}
      - STATGATE_REGISTRY_JWT_SECRET=${STATGATE_REGISTRY_JWT_SECRET:?STATGATE_REGISTRY_JWT_SECRET must be set}
      - STATGATE_INTERNAL_API_KEY=${STATGATE_INTERNAL_API_KEY:?STATGATE_INTERNAL_API_KEY must be set}
      - STATGATE_REGISTRY_API_URL=http://statgate-registry-api:9090/api
    ports:
      - "8000:8000"
    volumes:
      - jupyterhub_data:/srv/jupyterhub
      - ./monitoring/jupyterhub/jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py:ro
    restart: unless-stopped
    networks:
      - statgate-network

  superset:
    image: apache/superset:latest
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY must be set}
      - SUPERSET_LOAD_EXAMPLES=no
    volumes:
      - superset_data:/var/lib/superset
    restart: unless-stopped
    networks:
