      - STATGATE_JWT_AUDIENCE=${STATGATE_JWT_AUDIENCE:-statgate}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      statgate-enterprise-core:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - statgate-network


# â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # APP 6: NATIONAL & GLOBAL FEDERATION (P23/P30) â€” statfederation :8105
  # APP 8: IoT, SENSORS & MOBILE FIELD OPS (P27/P43) â€” statiot :8106
  # APP 12: DATA ENGINEERING, SCIENCE & SEARCH (P37/P38/P47) â€” statdata :8107
  # All consume statgate-lib (event bus, auth, health/metrics) and join the
  # statgate-network so they communicate with the other apps.
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  statfederation:
    build:
      context: .
      dockerfile: StatFederation/backend/Dockerfile
    ports:
      - "8105:8105"
    environment:
      - PORT=8105
      - STATGATE_ENV=${STATGATE_ENV:-production}
      - STATFEDERATION_DB_HOST=postgres
      - STATFEDERATION_DB_PORT=5432
      - STATFEDERATION_DB_USER=StatFederation
      - STATFEDERATION_DB_PASSWORD=${STATFEDERATION_DB_PASSWORD:?STATFEDERATION_DB_PASSWORD must be set}
      - STATFEDERATION_DB_NAME=statfederation
      - STATFEDERATION_DB_SSLMODE=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - STATTRUST_API_URL=http://statgate-trust-api:8080
      - STATGATE_REGISTRY_JWT_SECRET=${STATGATE_REGISTRY_JWT_SECRET:?STATGATE_REGISTRY_JWT_SECRET must be set}
      - STATGATE_JWT_ISSUER=${STATGATE_JWT_ISSUER:-statgate-registry}
      - STATGATE_JWT_AUDIENCE=${STATGATE_JWT_AUDIENCE:-statgate}
      - CORS_ALLOWED_ORIGIN=*
      - STATGATE_NODE_ID=NODE-FED-HQ-001
      - STATGATE_JURISDICTION=NATIONAL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      statgate-enterprise-core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8105/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  statfederation-ui:
    build:
      context: ./StatFederation/frontend
      dockerfile: Dockerfile
    ports:
      - "3016:80"
    depends_on:
      - statfederation
    restart: unless-stopped
    networks:
      - statgate-network

  statiot:
    build:
      context: .
      dockerfile: StatIoT/backend/Dockerfile
    ports:
      - "8106:8106"
    environment:
      - STATIOT_PORT=8106
      - STATGATE_ENV=${STATGATE_ENV:-production}
      - STATIOT_DB_HOST=postgres
      - STATIOT_DB_PORT=5432
      - STATIOT_DB_USER=${KAGGLE_DB_USER:-Kaggle}
      - STATIOT_DB_PASSWORD=${KAGGLE_DB_PASSWORD:?KAGGLE_DB_PASSWORD must be set}
      - STATIOT_DB_NAME=statiot
      - STATIOT_DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - STATGATE_REGISTRY_JWT_SECRET=${STATGATE_REGISTRY_JWT_SECRET:?STATGATE_REGISTRY_JWT_SECRET must be set}
      - STATIOT_GATEWAY_SECRET=${STATIOT_GATEWAY_SECRET:-statiot-device-auth-secret-key-prod}
      - CORS_ALLOWED_ORIGIN=*
      - STATGATE_ENTERPRISE_API_URL=http://statgate-enterprise-core:8096/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      statgate-enterprise-core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8106/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  statdata:
    build:
      context: .
      dockerfile: StatData/backend/Dockerfile
    ports:
      - "8107:8107"
    environment:
      - PORT=8107
      - APP_ENV=${STATGATE_ENV:-production}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=StatDataEngine
      - DB_PASSWORD=${STATDATA_DB_PASSWORD:?STATDATA_DB_PASSWORD must be set}
      - DB_NAME=statdata
      - DB_SSLMODE=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${STATGATE_REGISTRY_JWT_SECRET:?STATGATE_REGISTRY_JWT_SECRET must be set}
      - JWT_ISSUER=${STATGATE_JWT_ISSUER:-statgate-registry}
      - JWT_AUDIENCE=${STATGATE_JWT_AUDIENCE:-statgate}
      - CORS_ALLOWED_ORIGIN=*
      - DEFAULT_TENANT_ID=default
      - STATGATE_ENTERPRISE_API_URL=http://statgate-enterprise-core:8096/api
      - MAX_WORKERS=32
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      statgate-enterprise-core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8107/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  # PHASE 10/44 â€” StatSpatial (GIS & Spatial Analytics) â€” brought into the stack
  statgate-spatial-api:
    build:
      context: .
      dockerfile: StatSpatial/backend/Dockerfile
    ports:
      - "8108:4200"
    environment:
      - BACKEND_PORT=4200
      - STATSPATIAL_DB_HOST=postgres
      - STATSPATIAL_DB_PORT=5432
      - STATSPATIAL_DB_NAME=statspatial
      - STATSPATIAL_DB_USER=StatSpatial
      - STATSPATIAL_DB_PASSWORD=${STATSPATIAL_DB_PASSWORD:?STATSPATIAL_DB_PASSWORD must be set}
      - STATSPATIAL_DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4200/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  statgate-spatial-ui:
    build:
      context: ./StatSpatial/frontend
      args:
        - VITE_SPATIAL_API_URL=http://localhost:8108
    ports:
      - "3017:80"
    depends_on:
      statgate-spatial-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  # PHASE 11/43 â€” StatCollect (Field Ops & Digital Data Collection) â€” brought into the stack
  statcollect:
    build:
      context: ./StatCollect
    ports:
      - "8081:8080"
    volumes:
      - statcollect_data:/data
    environment:
      - STATCOLLECT_DATA_DIR=/data
      - STATCOLLECT_PORT=:8080
      - STATCOLLECT_DB_USER=StatCollect
      - STATCOLLECT_DB_PASSWORD=${STATCOLLECT_DB_PASSWORD:?STATCOLLECT_DB_PASSWORD must be set}
      - STATCOLLECT_DB_NAME=statcollect
      - STATCOLLECT_DB_HOST=postgres
      - STATCOLLECT_DB_PORT=5432
      - STATCOLLECT_API_KEY=${STATCOLLECT_API_KEY:?STATCOLLECT_API_KEY must be set}
      - STATCOLLECT_ADMIN_KEYS=${STATCOLLECT_ADMIN_KEYS:?STATCOLLECT_ADMIN_KEYS must be set}
      - STATCOLLECT_USE_S3=false
      # StatGate platform integration
      - STATGATE_REGISTRY_JWT_SECRET=${STATGATE_REGISTRY_JWT_SECRET:?STATGATE_REGISTRY_JWT_SECRET must be set}
      - STATGATE_INTERNAL_API_KEY=${STATGATE_INTERNAL_API_KEY:?STATGATE_INTERNAL_API_KEY must be set}
      - STATGATE_TENANT_ID=${STATGATE_TENANT_ID:-default}
      - STATCOLLECT_ENABLE_EVENTS=true
      - STATCOLLECT_ENABLE_STATCHAT=true
      - REDIS_ADDR=redis:6379
      - STATCHAT_API_URL=http://statchat-backend:4000
      - STATGATE_REGISTRY_API_URL=http://statgate-registry-api:9090/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - statgate-network


networks:
  statgate-network:
    driver: bridge

volumes:
  pgdata:
