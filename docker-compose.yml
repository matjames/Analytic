  airflow:
    image: apache/airflow:2.6.3
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${KAGGLE_DB_USER:-Kaggle}:${KAGGLE_DB_PASSWORD:?KAGGLE_DB_PASSWORD must be set}@postgres:5432/${KAGGLE_DB_NAME:-statgate_ml_staging}
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_USER:?AIRFLOW_USER must be set}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_PASSWORD:?AIRFLOW_PASSWORD must be set}
    command: standalone
    ports:
      - "8085:8080"
    volumes:
      - ./monitoring/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    restart: unless-stopped
    networks:
      - statgate-network

  mlflow:
    image: larribas/mlflow:latest
    command: --host 0.0.0.0 --port 5000
    ports:
      - "5002:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=s3://mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped
    networks:
      - statgate-network

