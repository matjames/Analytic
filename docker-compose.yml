      args:
        VITE_TURN_URL: ${TURN_PUBLIC_URL:-localhost:3478}
        VITE_TURN_USERNAME: ${TURN_USERNAME:?TURN_USERNAME must be set}
        VITE_TURN_CREDENTIAL: ${TURN_CREDENTIAL:?TURN_CREDENTIAL must be set}
    ports:
      - "3009:80"
    depends_on:
      statchat-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  statchat-turn:
    image: coturn/coturn:4.17-alpine
    command:
      - --log-file=stdout
      - --lt-cred-mech
      - --no-tls
      - --realm=${TURN_REALM:-statgate.local}
      - --user=${TURN_USERNAME:?TURN_USERNAME must be set}:${TURN_CREDENTIAL:?TURN_CREDENTIAL must be set}
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped
    networks:
      - statgate-network

