  # UNIFIED STATGATE PLATFORM - ALL SERVICES
  # Ã¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢Â
  # NOTE: All DB credentials are sourced from .env (single source of truth).
  # The DB *host* is set to the `postgres` service name inside Docker networking.

  # Ã¢â€â‚¬Ã¢â€â‚¬ PostgreSQL (existing databases with data) Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
  # Databases and roles are created by ./docker/postgres-init/*.sql.
  # Passwords are NOT stored in this file. They are injected from the
  # environment at runtime and FAIL CLOSED when missing.
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=${KAGGLE_DB_USER:-Kaggle}
      - POSTGRES_PASSWORD=${KAGGLE_DB_PASSWORD:?KAGGLE_DB_PASSWORD must be set}
      - POSTGRES_DB=${KAGGLE_DB_NAME:-statgate_ml_staging}
      # Per-database credentials injected for bootstrap scripts (fail-closed):
      - HELPDESK_DB_PASSWORD=${HELPDESK_DB_PASSWORD:?HELPDESK_DB_PASSWORD must be set}
      - REGISTRY_DB_PASSWORD=${REGISTRY_DB_PASSWORD:?REGISTRY_DB_PASSWORD must be set}
      - STATCHAT_DB_PASSWORD=${STATCHAT_DB_PASSWORD:?STATCHAT_DB_PASSWORD must be set}
      - PMS_DB_PASSWORD=${PMS_DB_PASSWORD:?PMS_DB_PASSWORD must be set}
      - RMS_DB_PASSWORD=${RMS_DB_PASSWORD:?RMS_DB_PASSWORD must be set}
      - GOVERNANCE_DB_PASSWORD=${GOVERNANCE_DB_PASSWORD:?GOVERNANCE_DB_PASSWORD must be set}
      - STATSPATIAL_DB_PASSWORD=${STATSPATIAL_DB_PASSWORD:?STATSPATIAL_DB_PASSWORD must be set}
      - KNOWLEDGE_DB_PASSWORD=${KNOWLEDGE_DB_PASSWORD:?KNOWLEDGE_DB_PASSWORD must be set}
      - AIENG_DB_PASSWORD=${AIENG_DB_PASSWORD:?AIENG_DB_PASSWORD must be set}
      - LMS_DB_PASSWORD=${LMS_DB_PASSWORD:?LMS_DB_PASSWORD must be set}
      - GIS_DB_PASSWORD=${GIS_DB_PASSWORD:?GIS_DB_PASSWORD must be set}
      - BPM_DB_PASSWORD=${BPM_DB_PASSWORD:?BPM_DB_PASSWORD must be set}
      - STATFEDERATION_DB_PASSWORD=${STATFEDERATION_DB_PASSWORD:?STATFEDERATION_DB_PASSWORD must be set}
      - STATIOT_DB_PASSWORD=${STATIOT_DB_PASSWORD:?STATIOT_DB_PASSWORD must be set}
      - STATDATA_DB_PASSWORD=${STATDATA_DB_PASSWORD:?STATDATA_DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KAGGLE_DB_USER:-Kaggle} -d ${KAGGLE_DB_NAME:-statgate_ml_staging} -h localhost"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  # Ã¢â€â‚¬Ã¢â€â‚¬ Redis (shared event bus & cache) Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  # Ã¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢ÂÃ¢â€¢Â
  # 1. APP LAUNCHER (Next.js - main entry point)
