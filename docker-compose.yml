  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - statgate-network

  jupyterhub:
    profiles:
      - "analytics-labs"
    build:
      context: ./jupyterhub
    environment:
      - STATGATE_JUPYTERHUB_ENABLED=${STATGATE_JUPYTERHUB_ENABLED:-true}
      - STATGATE_REGISTRY_JWT_SECRET=${STATGATE_REGISTRY_JWT_SECRET:?STATGATE_REGISTRY_JWT_SECRET must be set}
      - STATGATE_INTERNAL_API_KEY=${STATGATE_INTERNAL_API_KEY:?STATGATE_INTERNAL_API_KEY must be set}
      - STATGATE_REGISTRY_API_URL=http://statgate-registry-api:9090/api
    ports:
      - "8000:8000"
    volumes:
      - jupyterhub_data:/srv/jupyterhub
      - ./monitoring/jupyterhub/jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py:ro
    restart: unless-stopped
    networks:
      - statgate-network

  superset:
    image: apache/superset:latest
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY must be set}
      - SUPERSET_LOAD_EXAMPLES=no
    volumes:
      - superset_data:/var/lib/superset
    restart: unless-stopped
    networks:
      - statgate-network

  airflow:
    image: apache/airflow:2.6.3
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${KAGGLE_DB_USER:-Kaggle}:${KAGGLE_DB_PASSWORD:?KAGGLE_DB_PASSWORD must be set}@postgres:5432/${KAGGLE_DB_NAME:-statgate_ml_staging}
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_USER:?AIRFLOW_USER must be set}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_PASSWORD:?AIRFLOW_PASSWORD must be set}
    command: standalone
    ports:
      - "8085:8080"
    volumes:
      - ./monitoring/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    restart: unless-stopped
    networks:
      - statgate-network

  mlflow:
    image: larribas/mlflow:latest
    command: --host 0.0.0.0 --port 5000
    ports:
      - "5002:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=s3://mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped
    networks:
      - statgate-network

