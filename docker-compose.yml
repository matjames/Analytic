services:
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # UNIFIED STATGATE PLATFORM - ALL SERVICES
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # NOTE: All DB credentials are sourced from .env (single source of truth).
  # The DB *host* is set to the `postgres` service name inside Docker networking.

  # â”€â”€ PostgreSQL (existing databases with data) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Databases and roles are created by ./docker/postgres-init/*.sql.
  # Passwords are NOT stored in this file. They are injected from the
  # environment at runtime and FAIL CLOSED when missing.
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=${KAGGLE_DB_USER:-Kaggle}
      - POSTGRES_PASSWORD=${KAGGLE_DB_PASSWORD:?KAGGLE_DB_PASSWORD must be set}
      - POSTGRES_DB=${KAGGLE_DB_NAME:-statgate_ml_staging}
      # Per-database credentials injected for bootstrap scripts (fail-closed):
      - HELPDESK_DB_PASSWORD=${HELPDESK_DB_PASSWORD:?HELPDESK_DB_PASSWORD must be set}
      - REGISTRY_DB_PASSWORD=${REGISTRY_DB_PASSWORD:?REGISTRY_DB_PASSWORD must be set}
      - STATCHAT_DB_PASSWORD=${STATCHAT_DB_PASSWORD:?STATCHAT_DB_PASSWORD must be set}
      - PMS_DB_PASSWORD=${PMS_DB_PASSWORD:?PMS_DB_PASSWORD must be set}
      - RMS_DB_PASSWORD=${RMS_DB_PASSWORD:?RMS_DB_PASSWORD must be set}
      - GOVERNANCE_DB_PASSWORD=${GOVERNANCE_DB_PASSWORD:?GOVERNANCE_DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KAGGLE_DB_USER:-Kaggle} -d ${KAGGLE_DB_NAME:-statgate_ml_staging} -h localhost"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  # â”€â”€ Redis (shared event bus & cache) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # 1. APP LAUNCHER (Next.js - main entry point)
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  statgate-launcher:
    build:
      context: ./appluancher
    ports:
      - "3006:3002"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_NAME=StatGate
      - FLASK_ANALYTICS_URL=http://statgate-analytics:5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # 2. STATGATE ANALYTICS - Go Core Engine
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  statgate-core:
    build:
      context: ./backend
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - STATGATE_ENV=production
      - BIND_ADDRESS=0.0.0.0
      - CORS_ALLOWED_ORIGIN=http://localhost:5000
      - STATGATE_INTERNAL_API_KEY=${STATGATE_INTERNAL_API_KEY:?STATGATE_INTERNAL_API_KEY must be set}
      - FLASK_BACKEND_URL=http://statgate-analytics:5000
      - KAGGLE_DB_HOST=postgres
      - KAGGLE_DB_PORT=${KAGGLE_DB_PORT:-5432}
      - KAGGLE_DB_NAME=${KAGGLE_DB_NAME:-statgate_ml_staging}
      - KAGGLE_DB_USER=${KAGGLE_DB_USER:-Kaggle}
      - KAGGLE_DB_PASSWORD=${KAGGLE_DB_PASSWORD:?KAGGLE_DB_PASSWORD must be set}
      - KAGGLE_DB_SSLMODE=${KAGGLE_DB_SSLMODE:-disable}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # 3. STATGATE ANALYTICS - Flask UI
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  statgate-analytics:
    build:
      context: ./frontend
    ports:
      - "5000:5000"
    environment:
      - FLASK_PORT=5000
      - GO_BACKEND_URL=http://statgate-core:8080
      - ANALYTICS_REQUIRE_AUTH=${ANALYTICS_REQUIRE_AUTH:-true}
      - STATCHAT_API_URL=http://statchat-backend:4000
      - STATCHAT_UI_URL=http://statchat-frontend:80
      - STATGATE_REGISTRY_API_URL=http://statgate-registry-api:9090/api
      - STATGATE_REGISTRY_UI_URL=http://statgate-registry-ui:80
      - ENABLE_NOTEBOOK_EXECUTION=false
      - KAGGLE_DB_HOST=postgres
      - KAGGLE_DB_PORT=${KAGGLE_DB_PORT:-5432}
      - KAGGLE_DB_NAME=${KAGGLE_DB_NAME:-statgate_ml_staging}
      - KAGGLE_DB_USER=${KAGGLE_DB_USER:-Kaggle}
      - KAGGLE_DB_PASSWORD=${KAGGLE_DB_PASSWORD:?KAGGLE_DB_PASSWORD must be set}
      - KAGGLE_DB_SSLMODE=${KAGGLE_DB_SSLMODE:-disable}
      - KAGGLE_STAGING_SCHEMA=${KAGGLE_STAGING_SCHEMA:-ml_staging}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - STATGATE_INTERNAL_API_KEY=${STATGATE_INTERNAL_API_KEY:?STATGATE_INTERNAL_API_KEY must be set}
      - STATGATE_REGISTRY_JWT_SECRET=${STATGATE_REGISTRY_JWT_SECRET:?STATGATE_REGISTRY_JWT_SECRET must be set}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?FLASK_SECRET_KEY must be set}
    volumes:
      - ./data:/app/data
      - ./frontend/config/services.json:/app/config/services.json:ro
    depends_on:
      statgate-core:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()\" >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # 4. FIELD OPERATIONS REGISTRY - Go API
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  statgate-registry-api:
    build:
      context: ./stage_register/go-backend
    ports:
      - "9090:9090"
    environment:
      - PORT=9090
      - REGISTRY_DB_HOST=postgres
      - REGISTRY_DB_PORT=${REGISTRY_DB_PORT:-5432}
      - REGISTRY_DB_USER=${REGISTRY_DB_USER:-Kaggle}
      - REGISTRY_DB_PASSWORD=${REGISTRY_DB_PASSWORD:?REGISTRY_DB_PASSWORD must be set}
      - REGISTRY_DB_NAME=${REGISTRY_DB_NAME:-kaggle}
      - DB_SSLMODE=${REGISTRY_DB_SSLMODE:-disable}
      - BASIC_AUTH_USERNAME=${BASIC_AUTH_USERNAME:?BASIC_AUTH_USERNAME must be set}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD:?BASIC_AUTH_PASSWORD must be set}
      - STATGATE_REGISTRY_JWT_SECRET=${STATGATE_REGISTRY_JWT_SECRET:?STATGATE_REGISTRY_JWT_SECRET must be set}
      - STATGATE_INTERNAL_API_KEY=${STATGATE_INTERNAL_API_KEY:?required}
      - JWT_SECRET=${STATGATE_REGISTRY_JWT_SECRET:?STATGATE_REGISTRY_JWT_SECRET must be set}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/ready >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # 5. FIELD OPERATIONS REGISTRY - React UI
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  statgate-registry-ui:
    build:
      context: ./stage_register/frontend
      args:
        REACT_APP_API_BASE_URL_PROD: http://localhost:9090/api
        REACT_APP_API_BASE_URL_DEV: http://localhost:9090/api
    ports:
      - "3007:80"
    depends_on:
      statgate-registry-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # 6. OPERATIONS HELPDESK - Node.js Backend
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  statgate-helpdesk-api:
    build:
      context: ./helpdesk-master/backend
    ports:
      - "5006:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${HELPDESK_DB_PORT:-5432}
      - POSTGRES_DB=${HELPDESK_DB_NAME:-statgate}
      - POSTGRES_USER=${HELPDESK_DB_USER:-statgate}
      - POSTGRES_PASSWORD=${HELPDESK_DB_PASSWORD:?HELPDESK_DB_PASSWORD must be set}
      - SECRETKEY=${STATGATE_REGISTRY_JWT_SECRET:?STATGATE_REGISTRY_JWT_SECRET must be set}
      - STATGATE_REGISTRY_JWT_SECRET=${STATGATE_REGISTRY_JWT_SECRET:?STATGATE_REGISTRY_JWT_SECRET must be set}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api-docs >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # 7. OPERATIONS HELPDESK - React UI
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  statgate-helpdesk-ui:
    build:
      context: ./helpdesk-master/frontend
      args:
        REACT_APP_API_BASE_URL: http://localhost:5006/api
    ports:
      - "3005:80"
    depends_on:
      statgate-helpdesk-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # 8. STATCHAT - Real-Time Collaboration Platform
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  statchat-backend:
    build:
      context: ./StatChat/backend
    ports:
      - "4000:4000"
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-4000}
      - STATCHAT_DB_HOST=postgres
      - STATCHAT_DB_PORT=${STATCHAT_DB_PORT:-5432}
      - STATCHAT_DB_NAME=${STATCHAT_DB_NAME:-statchat}
      - STATCHAT_DB_USER=${STATCHAT_DB_USER:-Statchat}
      - STATCHAT_DB_PASSWORD=${STATCHAT_DB_PASSWORD:?STATCHAT_DB_PASSWORD must be set}
      - STATCHAT_DB_SSLMODE=${STATCHAT_DB_SSLMODE:-disable}
      - STATCHAT_AUTH_REQUIRED=${STATCHAT_AUTH_REQUIRED:-true}
      - STATGATE_REGISTRY_JWT_SECRET=${STATGATE_REGISTRY_JWT_SECRET:?required}
      - STATGATE_REGISTRY_API_URL=http://statgate-registry-api:9090/api
      - STATGATE_INTERNAL_API_KEY=${STATGATE_INTERNAL_API_KEY:?required}
      - STATCHAT_CORS_ALLOWED_ORIGINS=${STATCHAT_CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/readyz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  statchat-frontend:
    build:
      context: ./StatChat/frontend
    ports:
      - "3009:80"
    depends_on:
      statchat-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - statgate-network

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # 9. PROJECTS MANAGEMENT SYSTEM (PMS)
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  statgate-pms-api:
    build:
      context: ./PMS/backend
