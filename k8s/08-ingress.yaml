---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: statgate-ingress
  namespace: statgate
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  tls:
  - hosts:
    - statgate.example.com
    secretName: statgate-tls
  rules:
  - host: statgate.example.com
    http:
      paths:
      - path: /registry
        pathType: Prefix
        backend:
          service:
            name: statgate-registry-ui
            port:
              number: 3007
      - path: /registry-api
        pathType: Prefix
        backend:
          service:
            name: statgate-registry-api
            port:
              number: 9090
      - path: /helpdesk
        pathType: Prefix
        backend:
          service:
            name: statgate-helpdesk-ui
            port:
              number: 3005
      - path: /helpdesk-api
        pathType: Prefix
        backend:
          service:
            name: statgate-helpdesk-api
            port:
              number: 5000
      - path: /pms
        pathType: Prefix
        backend:
          service:
            name: statgate-pms-ui
            port:
              number: 3010
      - path: /pms-api
        pathType: Prefix
        backend:
          service:
            name: statgate-pms-api
            port:
              number: 8080
      - path: /rms
        pathType: Prefix
        backend:
          service:
            name: statgate-rms-ui
            port:
              number: 3011
      - path: /rms-api
        pathType: Prefix
        backend:
          service:
            name: statgate-rms-api
            port:
              number: 8080
      - path: /governance
        pathType: Prefix
        backend:
          service:
            name: statgate-governance-ui
            port:
              number: 3012
      - path: /governance-api
        pathType: Prefix
        backend:
          service:
            name: statgate-governance-api
            port:
              number: 8080
      - path: /statchat
        pathType: Prefix
        backend:
          service:
            name: statchat-frontend
            port:
              number: 3009
      - path: /statchat-api
        pathType: Prefix
        backend:
          service:
            name: statchat-backend
            port:
              number: 4000
      - path: /analytics
        pathType: Prefix
        backend:
          service:
            name: statgate-analytics
            port:
              number: 5000
