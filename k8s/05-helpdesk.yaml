---
# Helpdesk API (Node.js)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statgate-helpdesk-api
  namespace: statgate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: statgate-helpdesk-api
  template:
    metadata:
      labels:
        app: statgate-helpdesk-api
    spec:
      containers:
      - name: helpdesk-api
        image: analytic-statgate-helpdesk-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "production"
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: statgate-env
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: statgate-env
              key: HELPDESK_DB_NAME
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: statgate-env
              key: HELPDESK_DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: statgate-secrets
              key: HELPDESK_DB_PASSWORD
        - name: SECRETKEY
          valueFrom:
            secretKeyRef:
              name: statgate-secrets
              key: STATGATE_REGISTRY_JWT_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api-docs
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: statgate-helpdesk-api
  namespace: statgate
  labels:
    app: statgate-helpdesk-api
spec:
  type: ClusterIP
  selector:
    app: statgate-helpdesk-api
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http

---
# Helpdesk UI (React)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statgate-helpdesk-ui
  namespace: statgate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: statgate-helpdesk-ui
  template:
    metadata:
      labels:
        app: statgate-helpdesk-ui
    spec:
      containers:
      - name: helpdesk-ui
        image: analytic-statgate-helpdesk-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        env:
        - name: REACT_APP_API_BASE_URL
          value: "http://statgate-helpdesk-api:5000/api"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: statgate-helpdesk-ui
  namespace: statgate
  labels:
    app: statgate-helpdesk-ui
spec:
  type: ClusterIP
  selector:
    app: statgate-helpdesk-ui
  ports:
  - port: 3005
    targetPort: 80
    protocol: TCP
    name: http
